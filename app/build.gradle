plugins { id 'com.android.application' }

dependencies {
    implementation files('libs/jsoup-1.24.1.jar')
    // 0.14.0 T02: Media3 1.11.1（Q6 稳定版）；jsoup 行与 compileOptions 一字不动。
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    // 0.34.0 阶段 2-B（Q3 采纳）：junrar 支持 CBR/RAR，Apache-2.0；仅引入 RAR 解码，7z 后置。
    implementation 'com.github.junrar:junrar:7.5.3'
}

android {
    namespace 'org.openleaf.reader'
    buildFeatures {
        buildConfig = true
    }
    compileSdk 36
    // T01: pin the NDK used for the one-time ndk-build toolchain verification.
    ndkVersion '27.0.12077973'
    // T01: prebuilt libopenleafmobi.so (built from pinned libmobi sources) ships from jniLibs.
    // No externalNativeBuild block: avoids duplicate .so packaging between jniLibs and ndk-build output.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    defaultConfig {
        applicationId 'org.openleaf.reader'
        minSdk 26
        targetSdk 35
        versionCode 75
        versionName '0.63.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}
